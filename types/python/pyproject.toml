[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "@@REPO@@"
# Keep in sync with src/@@DOMAIN@@/__init__.py (guarded by tests/test_metadata.py).
version = "0.0.1"
description = "@@DESCRIPTION@@"
readme = "README.md"
license = "MIT"
authors = [{ name = "@@AUTHOR@@" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "ruff"]

[project.scripts]
@@REPO@@ = "@@DOMAIN@@.__main__:main"

[project.urls]
Homepage = "https://github.com/@@OWNER@@/@@REPO@@"
Issues = "https://github.com/@@OWNER@@/@@REPO@@/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/@@DOMAIN@@"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, pyupgrade, import sorting from day one.
select = ["E", "F", "W", "B", "UP", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
