name: CI

on:
  push:
    branches: [@@BRANCH@@]
  pull_request:
  workflow_dispatch:
  # Weekly, so tool or upstream drift (a new hassfest rule, a dependency)
  # turns CI red even without commits; ci-watch.yml opens an issue.
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main (2026-10-19; no recent release)
        with:
          category: plugin

  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Security audit
        # High/critical advisories fail the build; the rest arrive as
        # Dependabot PRs.
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Committed bundle matches source
        # HACS serves dist/ from the repo, so it must be what src/ builds.
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is out of sync with src/. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- dist/
            exit 1
          fi
