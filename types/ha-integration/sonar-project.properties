# SonarCloud, CI-based analysis (optional, ADR-0001).
#
# Prerequisites (one-time, by the repo owner):
#   1. SonarCloud -> "Analyze new project" -> import this repository.
#   2. SonarCloud -> My Account -> Security -> generate a token.
#   3. gh secret set SONAR_TOKEN -R @@OWNER@@/@@REPO@@
#   4. SonarCloud project -> Administration -> Analysis Method ->
#      disable Automatic Analysis (conflicts with CI-based scanning).
# Until SONAR_TOKEN exists the workflow skips itself with a notice.

sonar.projectKey=@@OWNER@@_@@REPO@@
sonar.organization=@@OWNER@@

sonar.sources=custom_components
sonar.tests=tests
sonar.test.inclusions=tests/**/test_*.py
sonar.python.coverage.reportPaths=coverage.xml
