name: Release

# ADR-0001: a pushed tag must not become a release on its own. The tag is
# checked against package.json, release notes must already exist in
# CHANGELOG.md, and only then is the image built from the tagged tree and
# pushed to GHCR as `vX.Y.Z` (and `latest` for a non-pre-release).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write # push the image to ghcr.io
  actions: read # check the CI result of the tagged commit

jobs:
  release:
    name: Verify tag and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          if [ "$ok" = "0" ]; then
            echo "::error::No green CI run for $GITHUB_SHA. Tag a commit that passed CI on the default branch."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # No cache in a release: a poisoned cache entry would land in the
          # published image (the Clinejection attack, 2026).
          package-manager-cache: false

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

      - name: Tag matches the declared version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$version" != "$declared" ]; then
            echo "::error::Tag $tag declares version $version, but package.json says $declared."
            exit 1
          fi
          latest=true
          case "$tag" in *-*) latest=false ;; esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      - name: Extract the changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys

          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = (
              rf"^## \[v{re.escape(version)}\][^\n]*\n"
              r"(.*?)(?=^## \[|^\[[^\]]+\]: |\Z)"
          )
          match = re.search(pattern, text, re.S | re.M)
          if match is None:
              sys.exit(f"::error::CHANGELOG.md has no '## [v{version}]' section.")
          notes = match.group(1).strip()
          if not notes:
              sys.exit(f"::error::The '## [v{version}]' section in CHANGELOG.md is empty.")
          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest }}
      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # linux/amd64 only; add linux/arm64 (with docker/setup-qemu-action)
          # when a Raspberry Pi or Apple-silicon host needs the image.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No build cache in a release: same reason as the npm cache above.
          no-cache: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release for $TAG already exists."
            exit 1
          fi
          # Title from the annotated tag's message (`git tag -a vX -m "..."`).
          # Read via the API: actions/checkout force-overwrites the
          # triggering tag locally, so its message is unreachable with git.
          subject=""
          ref="repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
          if [ "$(gh api "$ref" --jq '.object.type')" = "tag" ]; then
            sha="$(gh api "$ref" --jq '.object.sha')"
            subject="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.message' | head -1)"
          fi
          subject="${subject#"$TAG"}"
          subject="${subject#" — "}"
          subject="${subject#" - "}"
          subject="${subject#": "}"
          title="$TAG${subject:+ — $subject}"
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          image="$(echo "$IMAGE:$TAG" | tr '[:upper:]' '[:lower:]')"
          printf "\n\nImage: \`%s\`\n" "$image" >> release-notes.md
          gh release create "$TAG" --title "$title" --notes-file release-notes.md \
            --verify-tag $pre
