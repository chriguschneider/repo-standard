name: Self-test

# Render every type and variant and run the rendered repo's own checks, so a
# change to the standard that breaks a type fails here, not in the next new
# repo.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: ${{ matrix.type }} ${{ matrix.variants }} (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { type: generic, mode: minimal, domain: demo-generic, variants: "" }
          - { type: python, mode: opt-in, domain: demo_tool, variants: "" }
          - { type: ha-integration, mode: autopilot, domain: demo_thing, variants: "" }
          - { type: ha-integration, mode: opt-in, domain: demo_thing, variants: "device smoke" }
          - { type: ha-integration, mode: opt-in, domain: demo_thing, variants: "with-card" }
          - { type: lovelace-card, mode: opt-in, domain: demo-card, variants: "" }
          - { type: website, mode: opt-in, domain: demo-site, variants: "" }
          - { type: website, mode: minimal, domain: demo-site, variants: "" }
          - { type: webapp, mode: opt-in, domain: demo-app, variants: "" }
    env:
      TYPE: ${{ matrix.type }}
      MODE: ${{ matrix.mode }}
      DOMAIN: ${{ matrix.domain }}
      VARIANTS: ${{ matrix.variants }}
      DEMO: ${{ github.workspace }}/../demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Render
        run: |
          args=()
          for v in $VARIANTS; do args+=(--variant "$v"); done
          python3 render.py --type "$TYPE" --mode "$MODE" "${args[@]}" \
            --out "$DEMO" \
            --set OWNER=octocat --set "AUTHOR=Mona Lisa" \
            --set REPO=demo --set "NAME=Demo" --set DOMAIN="$DOMAIN" \
            --set SITE_URL=https://example.org \
            --set "DESCRIPTION=A repo rendered by the repo-standard self-test." \
            | tee render.log
          if grep -q "unresolved placeholders" render.log; then exit 1; fi
          cd "$DEMO" && git init -q

      - name: Standard check
        run: python3 check.py "$DEMO"

      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          cd "$DEMO" && "$GITHUB_WORKSPACE/actionlint" -color

      - name: zizmor (workflow security)
        run: |
          pip install zizmor==1.31.1
          cd "$DEMO" && zizmor --persona regular --no-progress .

      - name: Checks (generic)
        if: matrix.type == 'generic'
        run: cd "$DEMO" && bash scripts/check.sh

      - name: Checks (python)
        if: matrix.type == 'python'
        run: |
          cd "$DEMO"
          pip install -e ".[test]" build
          ruff check src tests
          pytest -q
          python -m build

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.type == 'lovelace-card' || matrix.type == 'website' || matrix.type == 'webapp' || contains(matrix.variants, 'with-card')
        with:
          node-version: "22"

      - name: Checks (ha-integration)
        if: matrix.type == 'ha-integration'
        run: |
          cd "$DEMO"
          pip install -r requirements_test.txt
          ruff check custom_components tests
          pytest -q
          if [ -f package.json ]; then npm install --no-audit --no-fund && npx vitest run; fi
          rm -rf .pytest_cache node_modules
          docker run --rm -v "$PWD":/github/workspace ghcr.io/home-assistant/hassfest

      - name: Checks (lovelace-card)
        if: matrix.type == 'lovelace-card'
        run: |
          set -euo pipefail
          cd "$DEMO"
          npm install --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run typecheck
          npm test
          npm run build
          first="$(sha256sum dist/*.js)"
          npm run build
          [ "$first" = "$(sha256sum dist/*.js)" ] || { echo "::error::build is not reproducible"; exit 1; }

      - name: Checks (website)
        if: matrix.type == 'website'
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          cd "$DEMO"
          npm install --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Checks (webapp)
        if: matrix.type == 'webapp'
        run: |
          set -euo pipefail
          cd "$DEMO"
          npm install --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
          CI=1 npm run test:e2e
          docker build -t demo-webapp .
          docker run -d --name demo-webapp -p 127.0.0.1:3000:3000 -e ORIGIN=http://127.0.0.1:3000 demo-webapp
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then echo; docker rm -f demo-webapp; exit 0; fi
            sleep 1
          done
          echo "::error::/health did not answer within 30 s"; docker logs demo-webapp; docker rm -f demo-webapp; exit 1
