name: Self-test

# Render every type and run the rendered repo's own checks, so a change to
# the standard that breaks a type fails here, not in the next new repo.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: ${{ matrix.type }} (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { type: generic, mode: minimal, domain: demo-generic }
          - { type: python, mode: opt-in, domain: demo_tool }
          - { type: ha-integration, mode: autopilot, domain: demo_thing }
          - { type: lovelace-card, mode: opt-in, domain: demo-card }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Render
        run: |
          python3 render.py --type "${{ matrix.type }}" --mode "${{ matrix.mode }}" \
            --out "$RUNNER_TEMP/demo" \
            --set OWNER=octocat --set "AUTHOR=Mona Lisa" \
            --set REPO=demo --set "NAME=Demo" --set DOMAIN="${{ matrix.domain }}" \
            --set "DESCRIPTION=A repo rendered by the repo-standard self-test." \
            | tee render.log
          if grep -q "unresolved placeholders" render.log; then exit 1; fi
          cd "$RUNNER_TEMP/demo" && git init -q

      - name: Standard check
        run: python3 check.py "$RUNNER_TEMP/demo"

      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          cd "$RUNNER_TEMP/demo" && "$GITHUB_WORKSPACE/actionlint" -color

      - name: zizmor (workflow security)
        run: |
          pip install zizmor==1.31.1
          cd "$RUNNER_TEMP/demo" && zizmor --persona regular --no-progress .

      - name: Checks (generic)
        if: matrix.type == 'generic'
        working-directory: ${{ runner.temp }}/demo
        run: bash scripts/check.sh

      - name: Checks (python)
        if: matrix.type == 'python'
        working-directory: ${{ runner.temp }}/demo
        run: |
          pip install -e ".[test]" build
          ruff check src tests
          pytest -q
          python -m build

      - name: Checks (ha-integration)
        if: matrix.type == 'ha-integration'
        working-directory: ${{ runner.temp }}/demo
        run: |
          pip install -r requirements_test.txt
          ruff check custom_components tests
          pytest -q
          rm -rf .pytest_cache
          docker run --rm -v "$PWD":/github/workspace ghcr.io/home-assistant/hassfest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.type == 'lovelace-card'
        with:
          node-version: "22"

      - name: Checks (lovelace-card)
        if: matrix.type == 'lovelace-card'
        working-directory: ${{ runner.temp }}/demo
        run: |
          npm install --no-audit --no-fund
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm test
          npm run build
